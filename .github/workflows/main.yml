name: Build & Publish Latest APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Force Fix Broken Proguard Syntax
        run: |
          # Remove corrupt _prefix rule and add safe Room rule
          if [ -f "app/proguard-rules.pro" ]; then
            sed -i '/_prefix/d' app/proguard-rules.pro
            echo "-keep class androidx.room.RoomDatabase { *; }" >> app/proguard-rules.pro
            echo "-dontwarn androidx.room.**" >> app/proguard-rules.pro
            echo "Cleaned app/proguard-rules.pro successfully."
          fi

      - name: Generate Master Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=GTOOL, OU=Android, O=GTOOL-OFFICIAL, L=Patna, ST=Bihar, C=IN"

      - name: Backup Keystore to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RELEASE-KEYSTORE-BACKUP
          path: release.keystore
          retention-days: 90

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK via Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Sign and Finalize APK
        run: |
          mkdir -p release_out
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK found in release output directory"
            exit 1
          fi

          echo "Found APK: $APK_FILE"
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)

          # Sign APK
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "release" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out release_out/GTOOL-release-signed.apk \
            "$APK_FILE"

          # Verify signature
          "$APKSIGNER" verify --verbose release_out/GTOOL-release-signed.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: GTOOL Release ${{ github.ref_name || 'Build' }}
          draft: false
          prerelease: false
          files: release_out/GTOOL-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: GTOOL-Signed-Release-APK
          path: release_out/GTOOL-release-signed.apk
          retention-days: 14
          
