name: One Time Key Generator
on: workflow_dispatch

jobs:
  make_key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Key
        run: |
          keytool -genkeypair -v -keystore release.jks -alias gtoolx_key -keyalg RSA -keysize 2048 -validity 10000 -storepass "MyStrongSecretPass123" -keypass "MyStrongSecretPass123" -dname "CN=GToolX,O=GSD,C=IN"
          echo "=================== COPY THIS TEXT ==================="
          base64 -w 0 release.jks
          echo ""
          echo "======================================================"
          
