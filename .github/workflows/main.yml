name: Build & Publish Latest APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Permanent Signing Key
        env:
          KEY_DATA: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_DATA" ]; then
            echo "::warning ::Key secret nahi mila! Nayi permanent key banayi ja rahi hai..."
            keytool -genkeypair -v \
              -keystore permanent.jks \
              -alias gtool \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=GTOOL, O=Android, C=IN"
            
            # Base64 string runner console mein mask ho kar print hogi
            echo "--- COPY_THIS_KEY_START ---"
            base64 -w 0 permanent.jks
            echo ""
            echo "--- COPY_THIS_KEY_END ---"
          else
            echo "Existing secret key decode ki ja rahi hai..."
            echo "$KEY_DATA" | tr -d '\r\n ' | base64 -d > permanent.jks
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Permanent Key
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Unsigned ya default signed release APK dhund kar final sign karna
          TARGET_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$TARGET_APK" ]; then
            TARGET_APK="app/build/outputs/apk/release/app-release.apk"
          fi

          $BUILD_TOOLS_PATH/apksigner sign \
            --ks permanent.jks \
            --ks-key-alias gtool \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --out app/build/outputs/apk/release/GTOOL-X-signed.apk \
            "$TARGET_APK"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GTOOL-X-APK
          path: app/build/outputs/apk/release/GTOOL-X-signed.apk
