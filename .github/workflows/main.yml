

name: Build & Publish Latest APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# GitHub Release create karne ke liye write permissions
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Signing Key
        env:
          KEY_DATA: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEY_DATA" ]; then
            echo "Generating brand new key..."
            keytool -genkeypair -v \
              -keystore permanent.jks \
              -alias gtool \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=GTOOL, O=Android, C=IN"
            
            echo "--- COPY_THIS_KEY_START ---"
            base64 -w 0 permanent.jks
            echo ""
            echo "--- COPY_THIS_KEY_END ---"
          else
            echo "Decoding existing key..."
            echo "$KEY_DATA" | tr -d '\r\n ' | base64 -d > permanent.jks
          fi

      - name: Grant Execute Permission to Gradle
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Align and Sign APK
        run: |
          BUILD_TOOLS_PATH=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          
          # Target APK locate karna
          TARGET_APK=$(find app/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          echo "Found APK: $TARGET_APK"
          
          # Step 1: ZipAlign karna
          $BUILD_TOOLS_PATH/zipalign -v -p 4 "$TARGET_APK" app/build/outputs/apk/release/aligned.apk
          
          # Step 2: Full signature (v1, v2, v3, v4) ke sath sign karna
          $BUILD_TOOLS_PATH/apksigner sign \
            --ks permanent.jks \
            --ks-key-alias gtool \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out app/build/outputs/apk/release/GTOOL-X.apk \
            app/build/outputs/apk/release/aligned.apk

          # Verify signature
          $BUILD_TOOLS_PATH/apksigner verify -v app/build/outputs/apk/release/GTOOL-X.apk

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GTOOL-X-APK
          path: app/build/outputs/apk/release/GTOOL-X.apk

      - name: Auto Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "GTOOL X Production (Latest)"
          body: "Automated production release built via GitHub Actions."
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/GTOOL-X.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
