name: Build & Publish Latest APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Master Keystore Inside GitHub Runner
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/master_release.jks \
            -alias gtool_master \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=GTOOL, OU=App, O=GSD, L=Patna, ST=Bihar, C=IN"

      - name: Backup Keystore to Artifacts (Save for Future)
        uses: actions/upload-artifact@v4
        with:
          name: PERMANENT-KEYSTORE-BACKUP
          path: keystore/master_release.jks
          retention-days: 90

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK via Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign APK with Permanent Master Key
        run: |
          mkdir -p release_out
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*signed*" | head -n 1)

          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::Release APK not found in app/build/outputs/apk/release/"
            exit 1
          fi

          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          
          "$APKSIGNER" sign \
            --ks keystore/master_release.jks \
            --ks-key-alias "gtool_master" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out release_out/GTOOL-release-signed.apk \
            "$UNSIGNED_APK"

          "$APKSIGNER" verify --verbose release_out/GTOOL-release-signed.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: GTOOL Release ${{ github.ref_name || 'Build' }}
          draft: false
          prerelease: false
          files: release_out/GTOOL-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: GTOOL-Signed-Release-APK
          path: release_out/GTOOL-release-signed.apk
          retention-days: 14
