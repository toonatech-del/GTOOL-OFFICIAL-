name: Extract ZIP and Setup Repo

on:
  push:
  workflow_dispatch:

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP File
        run: |
          mkdir -p temp_extracted
          unzip -q GTOOL-X-main.zip -d temp_extracted/
          
          # Target folder detect karein
          SRC_DIR="temp_extracted"
          if [ -d "temp_extracted/GTOOL-X-main" ]; then
            SRC_DIR="temp_extracted/GTOOL-X-main"
          fi

          # Agar zip me .github/workflows hai toh usse hata dete hain taaki permission error na aaye
          rm -rf "$SRC_DIR/.github" || true

          # Files copy karein
          cp -r $SRC_DIR/* . 2>/dev/null || true
          cp -r $SRC_DIR/.* . 2>/dev/null || true

          # Cleanup
          rm -rf temp_extracted
          rm -f GTOOL-X-main.zip

      - name: Commit and Push Extracted Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: unzip and extract project files to root" || echo "No changes to commit"
          git push origin main
