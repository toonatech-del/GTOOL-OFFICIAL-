name: Build & Publish Latest APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Publish Latest APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Master Keystore
        run: |
          # Keystore root me generate hoga
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -dname "CN=GTOOL, OU=Android, O=GTOOL-OFFICIAL, L=Patna, ST=Bihar, C=IN"

      - name: Backup Keystore to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RELEASE-KEYSTORE-BACKUP
          path: release.keystore
          retention-days: 90

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK via Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # -x lint -x test se extra strict checks bypass hote hain
        run: ./gradlew assembleRelease -x lint -x test --stacktrace

      - name: Sign APK with apksigner
        run: |
          mkdir -p release_out
          
          # Built APK find karein
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          
          if [ -z "$RAW_APK" ]; then
            echo "::error::No APK found in app/build/outputs/apk/release/"
            exit 1
          fi

          echo "Target APK found: $RAW_APK"
          
          # Android SDK apksigner find karein
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools/ -name apksigner | sort -V | tail -n 1)
          
          # Sign manually
          "$APKSIGNER" sign \
            --ks release.keystore \
            --ks-key-alias "release" \
            --ks-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.KEYSTORE_PASSWORD }}" \
            --out release_out/GTOOL-release-signed.apk \
            "$RAW_APK"

          # Verify
          "$APKSIGNER" verify --verbose release_out/GTOOL-release-signed.apk

      - name: Publish Automatic GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'latest' }}
          name: GTOOL Release ${{ github.ref_name || 'Build' }}
          draft: false
          prerelease: false
          files: release_out/GTOOL-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact Backup
        uses: actions/upload-artifact@v4
        with:
          name: GTOOL-Signed-Release-APK
          path: release_out/GTOOL-release-signed.apk
          retention-days: 14
