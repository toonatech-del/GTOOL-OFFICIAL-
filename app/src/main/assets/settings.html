<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTOOL X Settings</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f1117;
      color: #f3f4f6;
      padding: 20px;
      min-height: 100vh;
    }
    .header {
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
    }
    .settings-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting-item {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .setting-item:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.08);
    }
    .setting-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-right: 14px;
      flex-shrink: 0;
    }
    .setting-icon.purple {
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .setting-icon.amber {
      background: rgba(245, 158, 11, 0.2);
      border: 1px solid rgba(245, 158, 11, 0.4);
    }
    .setting-icon.blue {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .setting-info {
      flex: 1;
    }
    .setting-name {
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 2px;
    }
    .setting-desc {
      font-size: 13px;
      color: #9ca3af;
    }
    .setting-arrow {
      color: #6b7280;
      margin-left: 8px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f59e0b;
      margin-top: 14px;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Settings</h1>
  </div>

  <div class="settings-list">
    <div class="section-title">General</div>

    <div class="setting-item" onclick="toggleBiometrics()">
      <div class="setting-icon amber">🔒</div>
      <div class="setting-info">
        <div class="setting-name">Biometric App Lock</div>
        <div class="setting-desc">Fingerprint / Face / PIN on launch</div>
      </div>
      <svg class="setting-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div class="setting-item" onclick="openBackup()">
      <div class="setting-icon blue">📁</div>
      <div class="setting-info">
        <div class="setting-name">Local Backup & Restore</div>
        <div class="setting-desc">Encrypted offline data export</div>
      </div>
      <svg class="setting-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <script>
    function toggleBiometrics() {
      if (window.Android && window.Android.toggleBiometrics) {
        window.Android.toggleBiometrics();
      }
    }

    function openBackup() {
      if (window.Android && window.Android.openBackup) {
        window.Android.openBackup();
      }
    }
  </script>
</body>
</html>
